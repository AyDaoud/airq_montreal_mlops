name: CI

on:
  # Run on every branch. The original filter was [main, master, "spec-*/**"],
  # which assumed all future work would live under spec-*; a fix/ branch then
  # got no CI at all until a PR was opened.
  push:
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-serving.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: flake8 src tests scripts

      - name: Format check
        run: black --check src tests scripts

      - name: Test
        run: pytest --cov=src/data --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bake the serving model
        run: |
          pip install -r requirements-serving.txt
          python -m scripts.bake_serving_model

      - name: Build serving image
        run: docker build -t airq-api:ci .

      - name: Report image size
        run: |
          BYTES=$(docker image inspect airq-api:ci --format '{{.Size}}')
          echo "image size: $((BYTES/1024/1024)) MB"

      - name: Smoke test the running container
        run: |
          docker run -d --name airq -p 8000:8000 airq-api:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null; then break; fi
            sleep 2
          done
          curl -sf http://localhost:8000/health | grep -q '"ok"'
          PAYLOAD=$(python -c "import json;f=json.load(open('artifacts/rf/feature_names.json'));print(json.dumps({'rows':[{k:1.0 for k in f}]}))")
          RESPONSE=$(curl -sf -X POST http://localhost:8000/predict \
            -H 'Content-Type: application/json' -d "$PAYLOAD")
          echo "response: $RESPONSE"
          echo "$RESPONSE" | python -c "import json,sys; b=json.load(sys.stdin); assert b['n']==1, b; assert isinstance(b['preds'][0], float), b; print('smoke test OK')"

      - name: Container logs on failure
        if: failure()
        run: docker logs airq || true

      - name: Clean up
        if: always()
        run: docker rm -f airq || true

  compose:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bake the serving model
        run: |
          pip install -r requirements-serving.txt
          python -m scripts.bake_serving_model

      - name: Bring the stack up
        run: docker compose up -d --build

      - name: Wait for the API
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null; then break; fi
            sleep 3
          done
          curl -sf http://localhost:8000/health | grep -q '"ok"'

      - name: Prometheus has a live scrape target
        run: |
          sleep 25
          curl -sf http://localhost:9090/api/v1/targets \
            | python -c "import json,sys; ts=json.load(sys.stdin)['data']['activeTargets']; assert any(t['health']=='up' for t in ts), ts; print('scrape target up')"

      - name: Grafana is healthy and provisioned the dashboard
        run: |
          curl -sf http://localhost:3300/api/health | grep -q ok
          curl -sf -u admin:admin "http://localhost:3300/api/search?query=AirQ" \
            | python -c "import json,sys; d=json.load(sys.stdin); assert d, 'dashboard not provisioned'; print('dashboard:', d[0]['title'])"

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 80

      - name: Tear down
        if: always()
        run: docker compose down -v
